<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Магазин{% endblock %}</title>
    <!-- Подключение Bootstrap CSS через CDN -->
    <link href="{% static 'css/bootstrap.min.css' %}" rel="stylesheet">
</head>
<body>

<div class="container my-5">

 <div class="row g-4">
     {% block content %}
<div class="container my-5">
    <div class="row">
        {% for product in products_avto %}
        <div class="col-md-6 col-lg-4">
            <div class="card h-100 shadow-sm">
                <img src="#"
                     class="card-img-top"
                     alt="Демонстрация товара">
                <div class="card-body d-flex flex-column">
                    <h5 class="card-title">{% url 'products_list' %}</h5>
                    <p class="card-text flex-grow-1">{{ product.description|truncatechars:100 }}</p>
                    <a href="#" class="btn btn-primary mt-3 align-self-start">Купить за {{ product.price }}</a>
                </div>
            </div>
        </div>
        {% endfor %}
    </div>
</div>
     {% endblock %}
 </div>
    <script src="{% static 'js/bootstrap.bundle.min.js' %}"></script>
</body>
</html>
