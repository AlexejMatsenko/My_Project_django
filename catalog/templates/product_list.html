{% extends 'base.html' %}
{% block title %}Все товары{% endblock %}
{% block content %}

<div class="container my-5">
    <div class="row">
        {% for product in products %}
        <div class="col-md-6 col-lg-4">
            <div class="card h-100 shadow-sm">
                <img src="{{ product.picture.url }}"
                     class="card-img-top"
                     alt="Демонстрация товара">
                <div class="card-body d-flex flex-column">
                    <h5 class="card-title">{{ product.name }}</h5>
                    <p class="card-text flex-grow-1">{{ product.description|truncatechars:100}}</p>
                    <a href="{% url 'catalog:product_detail' product.pk %}" class="btn btn-primary mt-3 align-self-start">Подробнее</a>
                </div>
            </div>
        </div>
        {% endfor %}
    </div>
</div>

{% endblock %}
